services:
  - type: web
    name: tradutor-libras
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./transcricoes.db
      - key: DEBUG
        value: "false"
    healthCheckPath: /api/health
