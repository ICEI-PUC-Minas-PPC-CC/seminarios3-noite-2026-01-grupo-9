# ========================================
# docker-compose.yml — Desenvolvimento Local
# Ambiente: localhost apenas
# ========================================

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./transcricoes.db
      - DEBUG=true
    volumes:
      # Hot-reload do código em desenvolvimento
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    restart: unless-stopped

